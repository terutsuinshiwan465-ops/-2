<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Розклад</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

:root {
  --bg: #121110;
  --line: #2b271f;
  --ink: #f2ece1;
  --muted: #94897a;
  --accent: #cf9a52;
  --danger: #b96a52;
}

body {
  margin: 0;
  padding: 28px 20px 48px;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.app { max-width: 560px; margin: 0 auto; }

.nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 14px;
}

.nav-arrow {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 22px;
  padding: 8px 14px;
  cursor: pointer;
  line-height: 1;
}

.nav-arrow:active { color: var(--ink); }

.day-name {
  font-size: 15px;
  font-weight: 500;
}

.day-name .qualifier {
  color: var(--muted);
  font-weight: 400;
}

.rule {
  border: none;
  border-top: 1px solid var(--line);
  margin: 0;
}

.status { padding: 20px 0 22px; }

.status-label {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}

.status-main {
  font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
  font-weight: 500;
  font-size: 27px;
  line-height: 1.25;
  letter-spacing: -0.2px;
}

.status-meta {
  margin-top: 5px;
  font-size: 13px;
  color: var(--muted);
}

.status-timer {
  margin-top: 10px;
  font-size: 13px;
  color: var(--accent);
}

.lesson {
  display: flex;
  gap: 14px;
  padding: 14px 0 14px 12px;
  border-bottom: 1px solid var(--line);
  border-left: 2px solid transparent;
}

.lesson:last-child { border-bottom: none; }

.lesson.active { border-left-color: var(--accent); }
.lesson.active .time { color: var(--accent); }
.lesson.active .lesson-title { font-weight: 600; }

.time {
  width: 64px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  color: var(--muted);
  padding-top: 1px;
}

.lesson-body { flex: 1; min-width: 0; }

.lesson-title {
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.35;
}

.lesson-meta {
  margin-top: 2px;
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.3;
}

.gap-row {
  text-align: center;
  padding: 11px 0;
  font-size: 12.5px;
  font-style: italic;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}

.empty {
  padding: 40px 0;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

.lesson-edit {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

.lesson-edit input[type="time"] {
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  padding: 4px 0;
  width: 62px;
}

.lesson-edit input[type="text"] {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 4px 2px;
}

.lesson-edit .del {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 19px;
  line-height: 1;
  cursor: pointer;
  padding: 4px 6px;
  flex-shrink: 0;
}

.lesson-edit .del:active { color: var(--danger); }

.add-lesson {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 2px;
  background: none;
  border: 0;
  color: var(--accent);
  font-size: 13px;
  cursor: pointer;
}

.edit-toggle {
  display: block;
  margin: 30px auto 0;
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 12.5px;
  cursor: pointer;
  padding: 6px;
  text-decoration: underline;
  text-decoration-color: var(--line);
  text-underline-offset: 3px;
}

.edit-toggle:active {
  color: var(--accent);
  text-decoration-color: var(--accent);
}

@media (max-width: 380px) {
  body { padding: 22px 16px 40px; }
  .status-main { font-size: 23px; }
  .time { width: 56px; font-size: 11px; }
  .lesson-title { font-size: 13.5px; }
}
</style>
</head>

<body>
<div class="app">

  <div class="nav-row">
    <button class="nav-arrow" onclick="changeDay(-1)">‹</button>
    <div class="day-name" id="day-display"></div>
    <button class="nav-arrow" onclick="changeDay(1)">›</button>
  </div>

  <hr class="rule">

  <div class="status">
    <div class="status-label" id="status-label">Статус</div>
    <div class="status-main" id="current-status">Завантаження…</div>
    <div class="status-meta" id="status-meta"></div>
    <div class="status-timer" id="timer-status"></div>
  </div>

  <hr class="rule">

  <div id="schedule-list"></div>

  <button class="edit-toggle" id="edit-toggle" onclick="toggleEdit()">Редагувати розклад</button>

</div>

<script>

const GAP_THRESHOLD_MIN = 15;
const STORAGE_KEY = "schedule-data";

const days = ["Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота", "Неділя"];

const DEFAULT_SCHEDULE = {
  0: [
    { start: "09:40", end: "10:25", name: "Укр. література · Углицький О.В. · 38" },
    { start: "10:30", end: "11:15", name: "Укр. література · Углицький О.В. · 38" },
    { start: "11:25", end: "12:10", name: "Біг-бенд · ВЗ" },
    { start: "12:15", end: "13:00", name: "Біг-бенд · ВЗ" },
    { start: "13:10", end: "13:55", name: "Біг-бенд · ВЗ" },
    { start: "14:00", end: "14:45", name: "Виховна година" }
  ],
  1: [
    { start: "08:00", end: "08:45", name: "Громад. осв. / Мистецтво · Сліпченко · 40" },
    { start: "08:50", end: "09:35", name: "Громад. осв. / Мистецтво · Сліпченко · 40" },
    { start: "09:40", end: "10:25", name: "Всесвітня історія · Сліпченко · 40" },
    { start: "10:30", end: "11:15", name: "Всесвітня історія · Сліпченко · 40" },
    { start: "11:25", end: "12:10", name: "Сольфеджіо I · Масловська · 36" },
    { start: "12:15", end: "13:00", name: "Сольфеджіо I · Масловська · 36" },
    { start: "13:10", end: "13:55", name: "Муз. література · Зіненко · 49" },
    { start: "14:00", end: "14:45", name: "Муз. література · Зіненко · 49" }
  ],
  2: [
    { start: "09:40", end: "10:25", name: "Українська мова · Углицький О.В. · 38" },
    { start: "10:30", end: "11:15", name: "Українська мова · Углицький О.В. · 38" },
    { start: "13:10", end: "13:55", name: "Англійська мова · Мирошниченко · 37" },
    { start: "14:00", end: "14:45", name: "Англійська мова · Мирошниченко · 37" }
  ],
  3: [
    { start: "13:10", end: "13:55", name: "Захист України · Мясоєдова-Федько · 40" },
    { start: "14:00", end: "14:45", name: "Захист України · Мясоєдова-Федько · 40" },
    { start: "14:55", end: "15:40", name: "Фізична культура · Ємельянцева · МЗ" },
    { start: "15:45", end: "16:30", name: "Фізична культура · Ємельянцева · МЗ" },
    { start: "16:40", end: "17:25", name: "Математика · Роговська О.М. · 38" },
    { start: "17:30", end: "18:15", name: "Математика · Роговська О.М. · 38" }
  ],
  4: [
    { start: "09:40", end: "10:25", name: "Теорія музики I · Масловська · 41" },
    { start: "10:30", end: "11:15", name: "Теорія музики I · Масловська · 41" },
    { start: "11:25", end: "12:10", name: "Біг-бенд · 31" },
    { start: "12:15", end: "13:00", name: "Біг-бенд · 31" },
    { start: "13:10", end: "13:55", name: "Біг-бенд · 31" },
    { start: "14:55", end: "15:40", name: "Теорія музики II · Масловська · 41" },
    { start: "15:45", end: "16:30", name: "Теорія музики II · Масловська · 41" }
  ],
  5: [
    { start: "09:40", end: "10:25", name: "Математика · Роговська О.М. · 38" },
    { start: "10:30", end: "11:15", name: "Математика · Роговська О.М. · 38" },
    { start: "11:25", end: "12:10", name: "Фізична культура · Ємельянцева · МЗ" },
    { start: "12:15", end: "13:00", name: "Фізична культура · Ємельянцева · МЗ" },
    { start: "13:10", end: "13:55", name: "Сольфеджіо II · Масловська · 36" },
    { start: "14:00", end: "14:45", name: "Сольфеджіо II · Масловська · 36" }
  ],
  6: []
};

let scheduleData = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
let editMode = false;
let renderedRows = [];

function getRealDayIndex(d) {
  return d.getDay() === 0 ? 6 : d.getDay() - 1;
}

const initialNow = new Date();
let realDayIndex = getRealDayIndex(initialNow);
let selectedDayIndex = realDayIndex;
if (initialNow.getHours() >= 19) {
  selectedDayIndex = (realDayIndex + 1) % 7;
}

function toMinutes(t) {
  const parts = t.split(":").map(Number);
  return parts[0] * 60 + parts[1];
}

function lessonDates(lesson, base) {
  const s = lesson.start.split(":").map(Number);
  const e = lesson.end.split(":").map(Number);
  const start = new Date(base);
  start.setHours(s[0], s[1], 0, 0);
  const end = new Date(base);
  end.setHours(e[0], e[1], 0, 0);
  return { start: start, end: end };
}

function sortedLessons(dayIdx) {
  return (scheduleData[dayIdx] || []).slice().sort(function (a, b) {
    return toMinutes(a.start) - toMinutes(b.start);
  });
}

function formatTimer(ms) {
  if (ms < 0) ms = 0;
  const seconds = Math.floor(ms / 1000);
  const minutes = Math.floor(seconds / 60);
  const sec = seconds % 60;
  if (minutes >= 60) {
    const hours = Math.floor(minutes / 60);
    const min = minutes % 60;
    return hours + " год " + String(min).padStart(2, "0") + " хв";
  }
  return minutes + " хв " + String(sec).padStart(2, "0") + " сек";
}

function formatDuration(mins) {
  if (mins >= 60) {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return m ? (h + " год " + m + " хв") : (h + " год");
  }
  return mins + " хв";
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function splitLessonName(name) {
  const parts = (name || "").split(" · ");
  return { title: parts[0] || "Без назви", meta: parts.slice(1).join(" · ") };
}

function computeStatusForToday() {
  const currentNow = new Date();
  const todayIdx = getRealDayIndex(currentNow);
  const lessons = sortedLessons(todayIdx);

  let current = null, prev = null, next = null;

  for (let i = 0; i < lessons.length; i++) {
    const lesson = lessons[i];
    const dates = lessonDates(lesson, currentNow);
    if (currentNow >= dates.start && currentNow <= dates.end) {
      current = Object.assign({}, lesson, dates);
      break;
    }
    if (currentNow < dates.start) {
      next = Object.assign({}, lesson, dates);
      break;
    }
    prev = Object.assign({}, lesson, dates);
  }

  return { current: current, prev: prev, next: next, currentNow: currentNow };
}

function setStatusLesson(lessonLike) {
  const main = document.getElementById("current-status");
  const meta = document.getElementById("status-meta");
  const split = splitLessonName(lessonLike.name);
  main.textContent = split.title;
  if (split.meta) {
    meta.textContent = split.meta;
    meta.style.display = "";
  } else {
    meta.textContent = "";
    meta.style.display = "none";
  }
}

function updateLiveStatus() {
  const result = computeStatusForToday();
  const label = document.getElementById("status-label");
  const timer = document.getElementById("timer-status");

  if (result.current) {
    label.textContent = "Зараз";
    setStatusLesson(result.current);
    timer.textContent = "До кінця · " + formatTimer(result.current.end - result.currentNow);
    return;
  }

  if (result.next) {
    const gapMin = result.prev ? Math.round((result.next.start - result.prev.end) / 60000) : null;
    const isWindow = gapMin !== null && gapMin >= GAP_THRESHOLD_MIN;
    label.textContent = isWindow ? "Вікно" : (result.prev ? "Перерва" : "До початку занять");
    setStatusLesson(result.next);
    timer.textContent = "Через · " + formatTimer(result.next.start - result.currentNow);
    return;
  }

  label.textContent = "Статус";
  document.getElementById("current-status").textContent = "Пари закінчились";
  const meta = document.getElementById("status-meta");
  meta.textContent = "";
  meta.style.display = "none";
  timer.textContent = "";
}

function updateActiveHighlight() {
  const currentNow = new Date();
  const todayIdx = getRealDayIndex(currentNow);
  const isToday = selectedDayIndex === todayIdx;

  renderedRows.forEach(function (row) {
    const active = isToday && currentNow >= row.start && currentNow <= row.end;
    row.el.classList.toggle("active", active);
  });
}

function tick() {
  updateLiveStatus();
  updateActiveHighlight();
}

function isShowingTomorrow() {
  const current = new Date();
  const rIdx = getRealDayIndex(current);
  return selectedDayIndex === (rIdx + 1) % 7 && current.getHours() >= 19;
}

function renderDayHeader() {
  const el = document.getElementById("day-display");
  const name = days[selectedDayIndex];
  el.innerHTML = isShowingTomorrow()
    ? name + ' <span class="qualifier">· завтра</span>'
    : name;
}

function renderSchedule() {
  renderDayHeader();

  const container = document.getElementById("schedule-list");
  container.innerHTML = "";
  renderedRows = [];

  const lessons = sortedLessons(selectedDayIndex);

  if (!lessons.length && !editMode) {
    container.innerHTML = '<div class="empty">Пар немає</div>';
    return;
  }

  lessons.forEach(function (lesson, idx) {
    if (editMode) {
      const row = document.createElement("div");
      row.className = "lesson-edit";
      row.innerHTML =
        '<input type="time" value="' + lesson.start + '" onchange="updateLessonField(' + idx + ",'start',this.value)\">" +
        '<input type="time" value="' + lesson.end + '" onchange="updateLessonField(' + idx + ",'end',this.value)\">" +
        '<input type="text" value="' + escapeHtml(lesson.name) + '" placeholder="Назва пари" onchange="updateLessonField(' + idx + ",'name',this.value)\">" +
        '<button class="del" onclick="deleteLesson(' + idx + ')">×</button>';
      container.appendChild(row);
    } else {
      const dates = lessonDates(lesson, new Date());
      const split = splitLessonName(lesson.name);

      const item = document.createElement("div");
      item.className = "lesson";
      item.innerHTML =
        '<div class="time">' + lesson.start + "–" + lesson.end + "</div>" +
        '<div class="lesson-body">' +
        '<div class="lesson-title">' + escapeHtml(split.title) + "</div>" +
        (split.meta ? '<div class="lesson-meta">' + escapeHtml(split.meta) + "</div>" : "") +
        "</div>";
      container.appendChild(item);
      renderedRows.push({ el: item, start: dates.start, end: dates.end });

      const nextLesson = lessons[idx + 1];
      if (nextLesson) {
        const gap = toMinutes(nextLesson.start) - toMinutes(lesson.end);
        if (gap >= GAP_THRESHOLD_MIN) {
          const gapRow = document.createElement("div");
          gapRow.className = "gap-row";
          gapRow.textContent = "Вікно · " + formatDuration(gap);
          container.appendChild(gapRow);
        }
      }
    }
  });

  if (editMode) {
    const addBtn = document.createElement("button");
    addBtn.className = "add-lesson";
    addBtn.textContent = "+ Додати пару";
    addBtn.onclick = addLesson;
    container.appendChild(addBtn);
  }

  updateActiveHighlight();
}

function changeDay(direction) {
  selectedDayIndex = (selectedDayIndex + direction + 7) % 7;
  renderSchedule();
}

function toggleEdit() {
  editMode = !editMode;
  document.getElementById("edit-toggle").textContent = editMode ? "Готово" : "Редагувати розклад";
  renderSchedule();
}

function updateLessonField(idx, field, value) {
  const lessons = scheduleData[selectedDayIndex] || (scheduleData[selectedDayIndex] = []);
  if (!lessons[idx]) return;
  lessons[idx][field] = value;
  saveSchedule();
  renderSchedule();
}

function deleteLesson(idx) {
  const lessons = scheduleData[selectedDayIndex];
  if (!lessons) return;
  lessons.splice(idx, 1);
  saveSchedule();
  renderSchedule();
}

function addLesson() {
  if (!scheduleData[selectedDayIndex]) scheduleData[selectedDayIndex] = [];
  scheduleData[selectedDayIndex].push({ start: "09:00", end: "09:45", name: "" });
  saveSchedule();
  renderSchedule();
}

function loadSchedule() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      scheduleData = JSON.parse(raw);
    }
  } catch (e) {}
}

function saveSchedule() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scheduleData));
  } catch (e) {}
}

loadSchedule();
renderSchedule();
tick();
setInterval(tick, 1000);

</script>
</body>
</html>
