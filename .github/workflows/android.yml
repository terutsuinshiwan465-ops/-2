name: Build MIUI Schedule APK & Create Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: 11.0

      - name: Prepare Web Directory
        run: |
          mkdir -p public
          cp index.html public/index.html

      - name: Install Dependencies & Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Розклад" "com.schedule.app" --web-dir public
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..

      - name: Upload APK to Release
        run: |
          gh release create "v$(date +%Y.%m.%d)" android/app/build/outputs/apk/release/*.apk --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: 11.0

      - name: Prepare Web Directory
        run: |
          mkdir -p public
          cp index.html public/index.html

      - name: Build Android APK
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Розклад" "com.schedule.app" --web-dir public
          rm -rf android
          npx cap add android
          npx cap sync android
        with:
          accept-android-sdk-licenses: true

      - name: Prepare Web Directory
        run: |
          mkdir -p public
          cp index.html public/index.html

      - name: Build Android APK
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Розклад" "com.schedule.app" --web-dir public
          rm -rf android
          npx cap add android
          npx cap sync android
