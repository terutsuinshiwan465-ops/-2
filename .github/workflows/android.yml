name: Build MIUI Schedule APK & Create Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Дозвіл на створення Releases

    env:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Prepare Web Directory
        run: |
          mkdir -p public
          cp index.html public/index.html

      - name: Build Android APK
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Розклад" "com.schedule.app" --web-dir public
          rm -rf android
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Create Version JSON
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          cat <<EOF > version.json
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "$VERSION_NAME",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v$VERSION_NAME/Schedule-v$VERSION_NAME.apk"
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Версія 1.0.${{ github.run_number }}"
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          mkdir -p public
          cp index.html public/index.html

      - name: Build Android APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Розклад" "com.schedule.app" --web-dir public
          rm -rf android
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Розклад-MIUI-14.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
