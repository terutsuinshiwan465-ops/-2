name: Build MIUI Schedule APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize App & Build APK
        run: |
          mkdir public
          cp index.html public/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Розклад" "com.schedule.app" --web-dir public
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-MIUI-14.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Add Android platform
        working-directory: schedule_app
        run: cordova platform add android@14.0.1

      - name: Build APK
        working-directory: schedule_app
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-App-APK
          path: schedule_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
